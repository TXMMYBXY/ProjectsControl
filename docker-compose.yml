version: '3.9'

services:

  api:
    build:
      context: .
      dockerfile: ProjectsControl.Api/Dockerfile
    container_name: projects_api
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - project_storage:/app/storage
    restart: always

  client:
    build:
      context: ./project-control-reactapp
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: projects_client
    ports:
      - "${APP_PORT}:80"
    depends_on:
      - api

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: projects_db
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: ${ACCEPT_EULA}
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  project_storage:
  mssql_data: